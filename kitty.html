
<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kitty Cat Traveler</title>

    <link rel="stylesheet" href="kitty.css">
    <script src="kitty.js" defer></script>
</head>

<body>

<main class="game">

    <!-- Tilaa tulevalle navigointipalkille -->

    <div class="top">

        <h1>Minne matka?</h1>

        <!-- CatCoin -->
        <div class="coin-area">

            <button class="coin"
                    id="coinButton"
                    type="button"
                    onclick="showBalance()"
                    aria-label="Näytä rahamäärä"
                    aria-expanded="false">
                ¢
            </button>

            <div class="balance" id="balance" hidden></div>

        </div>

    </div>

    <div class="travel-area">

        <!-- Kissa lentokoneessa -->

                        <stop offset="100%" stop-color="#aaa4a2"/>

                    <linearGradient id="wing"
                                    x1="0%" y1="0%"
                                    x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#eee8de"/>
                        <stop offset="100%" stop-color="#bbb4ae"/>

                    <radialGradient id="eye">
                        <stop offset="0%" stop-color="#786657"/>
                        <stop offset="100%" stop-color="#302c30"/>
                    </radialGradient>

                </defs>

                   stroke-width="3"
                   stroke-linejoin="round"
                   stroke-linecap="round">

                    <path d="M159 195 L85 232
                             Q75 240 92 240
                             L195 213 Z"
                          fill="url(#wing)"/>

                    <!-- Pyrstö -->

                    <path d="M416 140 L450 174

                             M516 72 Q540 63 550 76"
                          fill="none" stroke-width="2"/>

                    <!-- Lentokoneen runko -->

                             Q365 158 418 185
                             Q449 202 452 235
                             Q453 269 419 287
                             Q362 303 274 267
                             L153 216
                             Q132 205 142 184 Z"
                          fill="url(#metal)"/>

                    <path d="M147 207
                             Q250 253 342 273
                             Q407 288 438 262"
                          fill="none"
                          stroke="#a39b9b"
                          stroke-width="5"/>

                    <path d="M196 173 Q185 202 197 232
                             M350 169 Q326 215 349 285"
                          fill="none" stroke-width="2"/>

                    <!-- Ohjaamo -->

                    <ellipse cx="275" cy="173"
                             rx="54" ry="20"
                             fill="#50464c"/>

                    <!-- Kissan pieni vartalo -->
                    <ellipse cx="270" cy="153"
                             rx="31" ry="38"
                             fill="#fffaf1"/>

                    <!-- Korvat -->
                    <path d="M211 102
                             Q202 65 214 45
                             Q240 52 254 77 Z"

                    <path d="M292 77
                             Q320 49 335 51

                    <path d="M219 86 L219 59

                    <!-- Kissan iso pää -->

                             Q353 146 325 165
                             Q301 181 269 178

                    <path d="M341 125 L323 132

                    <ellipse cx="243" cy="183"

                    <ellipse cx="433" cy="238"
                             rx="18" ry="21"

                             fill="url(#metal)"/>

                </g>

            </svg>

        </div>

        <!-- Maavaihtoehdot -->
        <div class="answers">

            <button class="answer" type="button"
                    aria-pressed="false"
                    onclick="chooseCountry('Egypti', this)">
                Egypti
            </button>

            <button class="answer" type="button"
                    aria-pressed="false"
                    onclick="chooseCountry('Japani', this)">
                Japani
            </button>

            <button class="answer" type="button"
                    aria-pressed="false"
                    onclick="chooseCountry('Ranska', this)">
                Ranska
            </button>

        </div>

    </div>

    <p id="destination" aria-live="polite"></p>

</main>


<!-- Pilvianimaatio -->
<div class="cloud-transition"
     id="cloudTransition"
     aria-hidden="true">

    <!-- Lentävä kissa pilvien päällä -->
    <div class="cloud-flyer" id="cloudFlyer">

        <svg viewBox="0 0 300 210"
             xmlns="http://www.w3.org/2000/svg"
             class="cloud-flyer-svg"
             role="img"
             aria-label="Kissa lentää vanhalla lentokoneella">

            <defs>
                <linearGradient id="flyMetal" x1="0%" y1="0%" x2="20%" y2="100%">
                    <stop offset="0%" stop-color="#fff5e9"/>
                    <stop offset="50%" stop-color="#ddd5cb"/>
                    <stop offset="100%" stop-color="#aaa4a2"/>
                </linearGradient>

                <linearGradient id="flyWing" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#eee8de"/>
                    <stop offset="100%" stop-color="#bbb4ae"/>
                </linearGradient>

                <radialGradient id="flyEye">
                    <stop offset="0%" stop-color="#786657"/>
                    <stop offset="100%" stop-color="#302c30"/>
                </radialGradient>
            </defs>

            <g stroke="#50464c"
               stroke-width="2.2"
               stroke-linejoin="round"
               stroke-linecap="round">

                <!-- Takasiipi -->
                <path d="M70 102 L38 118
                         Q32 122 40 122
                         L86 110 Z"
                      fill="url(#flyWing)"/>

                <!-- Pyrstö -->
                <path d="M70 102 L52 63

                         Q69 69 84 96 Z"
                      fill="url(#flyMetal)"/>

                <!-- Kauempi pääsiipi -->

                         Q170 76 234 37
                         Q249 28 256 33
                         Q259 37 251 45
                         L173 128 Z"
                      fill="url(#flyWing)"/>

                <!-- Rungon runko -->
                <path d="M63 98
                         Q91 85 131 86
                         Q171 85 197 98
                         Q212 107 214 123
                         Q214 140 198 149
                         Q171 156 130 139
                         L68 113
                         Q58 108 63 98 Z"
                      fill="url(#flyMetal)"/>

                <!-- Ohjaamo -->
                <ellipse cx="128" cy="94" rx="31" ry="13" fill="#79686d"/>
                <ellipse cx="128" cy="93" rx="25" ry="9" fill="#50464c"/>

                <!-- Kissan vartalo -->
                <ellipse cx="126" cy="82" rx="15" ry="19" fill="#fffaf1"/>

                <!-- Korvat -->
                <path d="M98 56
                         Q94 38 100 30
                         Q111 34 118 45 Z"
                      fill="#e1d8cd"/>

                <path d="M137 45

                         Q162 46 154 59 Z"

                <path d="M145 49

                <!-- Kissan pää -->

                         Q101 41 119 40
                         Q131 36 143 41
                         Q158 43 162 60
                         Q170 76 157 86
                         Q145 94 129 92
                         Q109 94 99 82

                <!-- Harmaat kuviot -->

                <path d="M126 42 Q131 39 137 42 L133 57 Z"
                      fill="#c8bfb6" stroke="none"/>
                <path d="M141 44 Q153 47 158 55 L149 58 Z"
                      fill="#c8bfb6" stroke="none"/>

                <!-- Silmät -->
                <ellipse cx="116" cy="66" rx="8" ry="9" fill="url(#flyEye)"/>
                <ellipse cx="142" cy="66" rx="8" ry="9" fill="url(#flyEye)"/>

                <!-- Heijastukset -->
                <circle cx="113" cy="62" r="3" fill="#ffffff" stroke="none"/>
                <circle cx="139" cy="62" r="3" fill="#ffffff" stroke="none"/>

                <!-- Posket -->

                <ellipse cx="153" cy="76" rx="5" ry="2.8" fill="#f3c5d0" stroke="none"/>

                <!-- Suu -->

    <!-- Pilvet -->

</body>
</html>
