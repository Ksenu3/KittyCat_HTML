<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kitty Cat Traveler Game</title>
    <style>
        body {
            background-color: #d8a3c4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .game-screen {
            position: relative;
            z-index: 1;
            box-sizing: border-box;
            width: 100%;
            max-width: 800px;
            padding: 28px 40px 36px;
            border: 2px solid #b57b9f;
            border-radius: 30px;
            background-color: rgba(255, 255, 255, 0.15);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        /* облачка с текстом */
        .welcome {
            background-image: url("cloud.svg");
            background-size: 100% 100%;
            background-repeat: no-repeat;
            padding: 22px 50px;
            font-size: 18px;
            font-weight: bold;
        }

        .title {
            background-image: url("cloud.svg");
            background-size: 100% 100%;
            background-repeat: no-repeat;
            padding: 45px 80px;
            font-size: 32px;
            font-weight: bold;
        }

        /* фото и кнопки рядом */
        .menu {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 48px;
            margin-top: 8px;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .cat-pic {
            width: 260px;
            transform: rotate(-6deg);
        }

        /* кнопки */
        .btn {
            position: relative;
            top: 0;
            margin-top: 28px;
            background-color: #fff0b3;
            border: 2px solid #333;
            border-radius: 50%;
            padding: 18px 50px;
            font-size: 22px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            box-shadow: 0 5px 0 #333;
            width: 280px;
        }

        .btn:hover {
            background-color: #ffe08a;
        }

        .btn:active {
            top: 4px;
            box-shadow: 0 1px 0 #333;
        }

        /* ушки на кнопках */
        .btn::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: -30px;
            height: 40px;
            background-image: url("ears.svg");
            background-size: 100% 100%;
            z-index: -1;
        }

        .btn:hover::before {
            background-image: url("ears-hover.svg");
        }

        /* фон */
        .fon {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* облака на фоне */
        .cloud {
            position: absolute;
            width: 130px;
            height: 45px;
            background-color: white;
            border-radius: 45px;
            opacity: 0.7;
        }

        .cloud::before {
            content: "";
            position: absolute;
            width: 55px;
            height: 55px;
            top: -28px;
            left: 18px;
            background-color: white;
            border-radius: 50%;
        }

        .cloud::after {
            content: "";
            position: absolute;
            width: 70px;
            height: 70px;
            top: -38px;
            right: 15px;
            background-color: white;
            border-radius: 50%;
        }

        .cloud1 { top: 10%; left: 6%; }
        .cloud2 { top: 70%; left: 3%; transform: scale(1.3); }
        .cloud3 { top: 20%; right: 5%; transform: scale(0.8); }
        .cloud4 { top: 78%; right: 8%; }
        .cloud5 { top: 45%; right: 2%; transform: scale(0.6); opacity: 0.5; }

        /* звёздочки */
        .star {
            position: absolute;
            color: white;
            font-size: 24px;
        }

        .yellow {
            color: #fff0b3;
        }

        .star1 { top: 6%; left: 30%; }
        .star2 { top: 35%; left: 8%; font-size: 16px; }
        .star3 { top: 8%; right: 25%; font-size: 30px; }
        .star4 { top: 55%; left: 15%; }
        .star5 { top: 88%; left: 30%; font-size: 18px; }
        .star6 { top: 62%; right: 14%; font-size: 18px; }
        .star7 { top: 92%; right: 30%; }
        .star8 { top: 38%; right: 15%; font-size: 28px; }

        /* сердечки */
        .heart {
            position: absolute;
            color: #ff9fd0;
            font-size: 22px;
        }

        .heart1 { top: 28%; left: 18%; }
        .heart2 { top: 12%; right: 12%; font-size: 18px; }
        .heart3 { top: 88%; left: 12%; font-size: 26px; }
        .heart4 { top: 70%; right: 25%; font-size: 16px; }

        /* лапки */
        .paw {
            position: absolute;
            font-size: 22px;
            opacity: 0.5;
        }

        .paw1 { bottom: 5%; right: 3%; }
        .paw2 { bottom: 13%; right: 7%; }
        .paw3 { bottom: 21%; right: 3%; }

        /* для телефона */
        @media (max-width: 640px) {
            .menu {
                flex-direction: column;
                gap: 4px;
            }

            .cat-pic {
                width: 170px;
            }

            .title {
                padding: 45px 40px;
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="fon">
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>
        <div class="cloud cloud4"></div>
        <div class="cloud cloud5"></div>

        <div class="star star1">✦</div>
        <div class="star yellow star2">✦</div>
        <div class="star yellow star3">✦</div>
        <div class="star star4">✦</div>
        <div class="star yellow star5">✦</div>
        <div class="star star6">✦</div>
        <div class="star yellow star7">✦</div>
        <div class="star star8">✦</div>

        <div class="heart heart1">♥</div>
        <div class="heart heart2">♥</div>
        <div class="heart heart3">♥</div>
        <div class="heart heart4">♥</div>

        <div class="paw paw1">🐾</div>
        <div class="paw paw2">🐾</div>
        <div class="paw paw3">🐾</div>
    </div>

    <div class="game-screen">
        <div class="welcome">Welcome ♡</div>

        <div class="title">Kitty Cat Traveler Game</div>

        <div class="menu">
            <img src="kissa.png" alt="Meme lentokissa" class="cat-pic">

            <div class="menu-buttons">
                <button class="btn" onclick="alert('Aloitetaan uusi peli!')">Uusi peli?</button>
                <button class="btn" onclick="alert('Jatketaan peliä!')">Jatko?</button>
            </div>
        </div>
    </div>

</body>
</html>
